[project]
name = "baseload-optimisation-atlas"
version = "1.8.0"
description = "Baseload Optimisation Atlas: optimal solar/wind/battery systems for a fixed baseload demand"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dask[array]>=2025.5.0",  # xarray/zarr chunked writes (Dataset.chunk())
    "geopandas",
    "matplotlib",
    "netcdf4>=1.6.0",  # preferred xarray NetCDF engine (see boa/geo/geospatial.py's engine fallback)
    "numba>=0.61.2",
    "numpy",
    "openpyxl",  # pandas.read_excel/ExcelWriter engine for the cost workbook (boa/inputs/costs.py, boa/geo/geospatial.py)
    "pandas",
    "pycountry",
    "reverse-geocoder",
    "rich",
    "shapely",
    "xarray>=2025.3.1",
    "zarr>=3.0.0",
]

[project.optional-dependencies]
# Kept optional so CI can skip the CDS client; lazy-imported by boa.cds.download
cds = [
    "cdsapi>=0.7.4",  # Copernicus Climate Data Store client (boa-cds-download)
]

[project.scripts]
boa-run = "boa.cli.run_simulation:main"
boa-promote-lcoe = "boa.cli.promote_lcoe:main"
boa-cds-prepare = "boa.cli.run_cds:prepare"
boa-cds-download = "boa.cli.run_cds:download"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["src/boa"]

[tool.hatch.build.targets.wheel]
packages = ["src/boa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
    "mypy",
    "ruff>=0.8.0",
]
