# Originals that BOA takes input values from.
#
# access = "download" (the default): one file at url, pinned by sha256. boa-sources-fetch downloads
#   it into <data root>/sources/<id>/ and checks its sha256.
# access = "cds-api": a data set of the Copernicus Climate Data Store. url is the data set page and
#   dataset the name in the CDS API request. boa-cds-download gets it (it needs a CDS account and
#   the accepted data set licence); boa-sources-fetch skips it.
#
# A value names its source as "<id>: <ref>", where <ref> is the text before the colon in one of
# the "tables" lines. "tags" says which inputs use the source:
#   costs             the boa-cost-data-core workbooks (scripts/cost/build_core.py)
#   capacity-ceiling  the capacity-ceiling densities and land-cover factors
#                     (boa.config.physical_parameters)

