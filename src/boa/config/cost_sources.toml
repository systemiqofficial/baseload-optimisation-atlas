# Original source files behind the BOA cost workbooks (CAPEX, OPEX, cost of capital).
#
# One [[source]] per original file. The schema and its checks are in cost_sources.py.
# `boa-sources-fetch` downloads each pinned file into <data root>/sources/<id>/<file> and
# checks its sha256. A workbook row names its source as "<id>: <item ref>".
#
# status        "pinned": url, file, accessed and sha256 are set and the file was downloaded.
#               "unresolved": a package uses the source, but its original file is not found.
# redistribute  true if the licence lets us publish a copy of the file. If false, keep only the
#               url and sha256; do not put the file in a package or in git.
# used_by       the cost packages that take values from the source, or "reference" for a source
#               that is registered for comparison only.
# [[source.item]] one table, figure or page that values come from. ref is the label in the
#               original (for an IRENA data file: the sheet name).
#   price_basis "real", "nominal", "not applicable" or "unknown"
#   tax         "pre-tax", "after-tax", "not applicable" or "unknown"

