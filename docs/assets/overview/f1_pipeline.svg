<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#000000">
  <title>BOA pipeline: weather data, frontier cache, query per investment year, per-year output files, promoted LCOE file</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="316" rx="8" fill="#FFFFFF"/>

  <!-- Inputs that enter at query time -->
  <rect x="356" y="16" width="232" height="58" rx="6" fill="#FFF4DB" stroke="#B07800" stroke-width="1.2"/>
  <text x="472" y="38" text-anchor="middle" font-weight="bold">Cost set</text>
  <text x="472" y="58" text-anchor="middle" font-size="12">CAPEX per year, OPEX, cost of capital</text>
  <line x1="472" y1="74" x2="472" y2="122" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Main chain -->
  <g stroke="#333333" stroke-width="1.2">
    <rect x="16" y="124" width="160" height="104" rx="6" fill="#EEF3F8"/>
    <rect x="200" y="124" width="160" height="104" rx="6" fill="#EEF3F8"/>
    <rect x="384" y="124" width="176" height="104" rx="6" fill="#FFF4DB"/>
    <rect x="584" y="124" width="170" height="104" rx="6" fill="#F2F2F2"/>
    <rect x="778" y="124" width="166" height="104" rx="6" fill="#F2F2F2"/>
  </g>

  <text x="96" y="148" text-anchor="middle" font-weight="bold">Weather data</text>
  <text x="96" y="170" text-anchor="middle" font-size="12">Hourly solar and wind</text>
  <text x="96" y="186" text-anchor="middle" font-size="12">capacity factors for</text>
  <text x="96" y="202" text-anchor="middle" font-size="12">one weather year,</text>
  <text x="96" y="218" text-anchor="middle" font-size="12">land-sea mask</text>

  <text x="280" y="148" text-anchor="middle" font-weight="bold">Frontier cache</text>
  <text x="280" y="170" text-anchor="middle" font-size="12">Dispatch results of the</text>
  <text x="280" y="186" text-anchor="middle" font-size="12">designs that meet the</text>
  <text x="280" y="202" text-anchor="middle" font-size="12">coverage target, for</text>
  <text x="280" y="218" text-anchor="middle" font-size="12">each land pixel</text>

  <text x="472" y="148" text-anchor="middle" font-weight="bold">Query</text>
  <text x="472" y="170" text-anchor="middle" font-size="12">For each investment year:</text>
  <text x="472" y="186" text-anchor="middle" font-size="12">price the stored designs,</text>
  <text x="472" y="202" text-anchor="middle" font-size="12">keep the design with</text>
  <text x="472" y="218" text-anchor="middle" font-size="12">the lowest LCOE</text>

  <text x="669" y="148" text-anchor="middle" font-weight="bold">Per-year files</text>
  <text x="669" y="170" text-anchor="middle" font-size="12">One GLOBAL NetCDF</text>
  <text x="669" y="186" text-anchor="middle" font-size="12">per investment year:</text>
  <text x="669" y="202" text-anchor="middle" font-size="12">LCOE, design, coverage,</text>
  <text x="669" y="218" text-anchor="middle" font-size="12">served fraction, status</text>

  <text x="861" y="148" text-anchor="middle" font-weight="bold">Promoted file</text>
  <text x="861" y="170" text-anchor="middle" font-size="12">One NetCDF with</text>
  <text x="861" y="186" text-anchor="middle" font-size="12">the LCOE of all</text>
  <text x="861" y="202" text-anchor="middle" font-size="12">investment years</text>
  <text x="861" y="218" text-anchor="middle" font-size="12">and the status</text>

  <g stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="176" y1="176" x2="198" y2="176"/>
    <line x1="360" y1="176" x2="382" y2="176"/>
    <line x1="560" y1="176" x2="582" y2="176"/>
    <line x1="754" y1="176" x2="776" y2="176"/>
  </g>

  <!-- How often each step runs -->
  <g font-size="12" fill="#333333">
    <line x1="16" y1="246" x2="360" y2="246" stroke="#5A7A99" stroke-width="2"/>
    <text x="188" y="266" text-anchor="middle">Built for each weather year, region and</text>
    <text x="188" y="282" text-anchor="middle">coverage target; built again when a new</text>
    <text x="188" y="298" text-anchor="middle">cost set needs more anchors</text>
    <line x1="384" y1="246" x2="944" y2="246" stroke="#B07800" stroke-width="2"/>
    <text x="664" y="266" text-anchor="middle">Repeated for each investment year,</text>
    <text x="664" y="282" text-anchor="middle">without a new dispatch simulation</text>
  </g>
</svg>
