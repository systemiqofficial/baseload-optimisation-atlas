<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">
  <title>Build once, price many: the frontier cache from the dispatch simulation, and the costs applied at query time</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
    <marker id="arrow-anchor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B07800"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="462" rx="8" fill="#FFFFFF"/>

  <!-- Build side -->
  <rect x="16" y="16" width="380" height="368" rx="8" fill="#EEF3F8" stroke="#5A7A99" stroke-width="1.2"/>
  <text x="206" y="40" text-anchor="middle" font-size="14" font-weight="bold">Build: dispatch simulation</text>
  <text x="206" y="58" text-anchor="middle" fill="#333333">For each weather year, region and coverage target</text>

  <g stroke="#333333" stroke-width="1.2" fill="#FFFFFF">
    <rect x="36" y="74" width="340" height="50" rx="6"/>
    <rect x="36" y="146" width="340" height="120" rx="6"/>
    <rect x="36" y="288" width="340" height="82" rx="6"/>
  </g>
  <text x="206" y="95" text-anchor="middle" font-weight="bold">Hourly profiles of one pixel</text>
  <text x="206" y="113" text-anchor="middle">Solar and wind capacity factors, one weather year</text>

  <text x="206" y="167" text-anchor="middle" font-weight="bold">Hourly dispatch simulation</text>
  <text x="206" y="186" text-anchor="middle">Coarse grid of (solar, wind) pairs: a lower limit</text>
  <text x="206" y="202" text-anchor="middle">of the smallest battery, to select a few patches</text>
  <text x="206" y="222" text-anchor="middle">Patches (fine grids): the smallest battery that</text>
  <text x="206" y="238" text-anchor="middle">meets the coverage target at each (solar, wind) pair</text>
  <text x="206" y="256" text-anchor="middle">(slow: many simulations of all hours)</text>

  <text x="206" y="309" text-anchor="middle" font-weight="bold">Frontier cache</text>
  <text x="206" y="328" text-anchor="middle">Per stored patch design: solar, wind, battery,</text>
  <text x="206" y="344" text-anchor="middle">hours covered, served fraction</text>
  <text x="206" y="361" text-anchor="middle" font-style="italic">No cost, no investment year, no load density</text>

  <g stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)">
    <line x1="206" y1="124" x2="206" y2="144"/>
    <line x1="206" y1="266" x2="206" y2="286"/>
  </g>

  <!-- Query side: drawn as a stack, because it repeats -->
  <rect x="552" y="28" width="380" height="368" rx="8" fill="#FBEBC6" stroke="#B07800" stroke-width="1"/>
  <rect x="546" y="22" width="380" height="368" rx="8" fill="#FDF0D2" stroke="#B07800" stroke-width="1"/>
  <rect x="540" y="16" width="380" height="368" rx="8" fill="#FFF4DB" stroke="#B07800" stroke-width="1.2"/>
  <text x="730" y="40" text-anchor="middle" font-size="14" font-weight="bold">Query: costs applied</text>
  <text x="730" y="58" text-anchor="middle" fill="#333333">For each investment year</text>

  <g stroke="#333333" stroke-width="1.2" fill="#FFFFFF">
    <rect x="560" y="74" width="340" height="66" rx="6"/>
    <rect x="560" y="176" width="340" height="80" rx="6"/>
    <rect x="560" y="294" width="340" height="66" rx="6"/>
  </g>
  <text x="730" y="95" text-anchor="middle" font-weight="bold">Costs of the pixel's cost key in that year</text>
  <text x="730" y="113" text-anchor="middle">CAPEX, OPEX, cost of capital</text>
  <text x="730" y="130" text-anchor="middle">→ four numbers: a_s, a_w, a_b, d0</text>

  <text x="730" y="197" text-anchor="middle" font-weight="bold">Price each stored design</text>
  <text x="730" y="216" text-anchor="middle">LCOE = (a_s·s + a_w·w + a_b·b^γ) / (d0 × served fraction)</text>
  <text x="730" y="234" text-anchor="middle">(fast: arithmetic only,</text>
  <text x="730" y="249" text-anchor="middle">no dispatch simulation)</text>

  <text x="730" y="320" text-anchor="middle" font-weight="bold">Lowest LCOE and its design</text>
  <text x="730" y="339" text-anchor="middle">Written to the per-year output file</text>

  <g stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)" fill="none">
    <line x1="730" y1="140" x2="730" y2="174"/>
    <line x1="730" y1="256" x2="730" y2="292"/>
    <!-- Cache to pricing -->
    <polyline points="376,329 468,329 468,216 558,216"/>
  </g>
  <text x="468" y="348" text-anchor="middle" fill="#333333">same cache</text>
  <text x="468" y="363" text-anchor="middle" fill="#333333">for each</text>
  <text x="468" y="378" text-anchor="middle" fill="#333333">investment year</text>

  <!-- Anchors: the only way a cost reaches the build -->
  <polyline points="560,107 444,107 444,194 378,194" fill="none" stroke="#B07800" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-anchor)"/>

  <g font-size="12">
    <line x1="24" y1="416" x2="64" y2="416" stroke="#B07800" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="74" y="420">Anchor cost mixes: they decide where the patches are, and thus which designs the cache contains.</text>
    <text x="74" y="438">A cost set that the stored anchors do not cover makes the build run again with more anchors.</text>
  </g>
</svg>
