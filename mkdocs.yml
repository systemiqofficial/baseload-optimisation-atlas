site_name: Baseload Optimisation Atlas
site_description: Lowest-cost solar, wind and battery mixes for constant baseload power, world-wide
site_url: https://systemiqofficial.github.io/baseload-optimisation-atlas/
repo_url: https://github.com/systemiqofficial/baseload-optimisation-atlas
repo_name: systemiqofficial/baseload-optimisation-atlas
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation and usage:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Preparing weather data: cds-data-pipeline.md
      - Preparing cost data: cost-data-prep.md
      - Running the model: running-the-model.md
      - Exporting results: promoted-lcoe-file.md
  - Methodology and data:
      - Overview: overview.md
      - Search algorithm: methodology.md
      - Model assumptions: model-assumptions.md
      - Weather data: weather-data.md
      - Cost data: cost-data.md
      - Known limitations: known-limitations.md
  - Code docs:
      - Architecture: architecture.md
      - API reference: api-reference.md
      - Development:
          - Development: development.md
          - Comparing code versions: comparing-code-versions.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: false
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
